[package]
name = "log-scrub-contract"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Regression-test log redaction before data leaves your environment"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-log-scrub-contract"
homepage = "https://log-scrub-contract.sociobot.in"
readme = "README.md"
keywords = ["logs", "redaction", "security", "cli", "ci"]
categories = ["command-line-utilities", "development-tools::testing"]

[lib]
name = "log_scrub_contract"

[[bin]]
name = "log-scrub"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.46", features = ["derive"] }
regex = "1.11.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"

[dev-dependencies]
tempfile = "3.21.0"

[profile.release]
lto = "thin"
strip = true

